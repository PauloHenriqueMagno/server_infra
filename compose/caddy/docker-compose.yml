services:
  caddy:
    image: ${IMAGE_CADDY}
    container_name: caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      CADDY_ISSUER: ${CADDY_ISSUER:-internal}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${CADDY_ADMIN_PORT:-2019}:2019"
    volumes:
      - ../../configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STORAGE_PATH:-/srv/data}/caddy/data:/data
      - ${STORAGE_PATH:-/srv/data}/caddy/config:/config
    networks:
      - infra
