services:
  postgres:
    image: ${IMAGE_POSTGRES}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Localhost only. Other computers reach this through an SSH tunnel.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${STORAGE_PATH:-/srv/data}/postgres:/var/lib/postgresql/data
      - ${BACKUP_PATH:-/srv/backups}/postgres:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - infra
