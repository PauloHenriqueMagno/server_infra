services:
  portainer:
    image: ${IMAGE_PORTAINER}
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_HTTP_PORT:-9443}:9443"
      - "${PORTAINER_EDGE_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STORAGE_PATH:-/srv/data}/portainer:/data
    networks:
      - infra
